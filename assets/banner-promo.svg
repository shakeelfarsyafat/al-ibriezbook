<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPromo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowPromo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="28" fill="url(#bgPromo)" />

  <circle cx="400" cy="240" r="230" fill="url(#amberGlow)" />

  <!-- Arabesque Pattern -->
  <g opacity="0.1" stroke="#fef08a" stroke-width="1.5" fill="none">
    <circle cx="400" cy="250" r="210" />
    <circle cx="400" cy="250" r="160" />
    <path d="M 400,40 Q 450,250 800,250" />
    <path d="M 400,40 Q 350,250 0,250" />
    <path d="M 400,460 Q 450,250 800,250" />
    <path d="M 400,460 Q 350,250 0,250" />
  </g>

  <!-- Central Special Offer Graphic Card -->
  <g transform="translate(400, 240)" filter="url(#shadowPromo)">
    <rect x="-240" y="-130" width="480" height="260" rx="24" fill="#1f1013" stroke="#f43f5e" stroke-width="2.5" />
    
    <!-- Gold Ribbon Border -->
    <rect x="-230" y="-120" width="460" height="240" rx="18" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8 4" opacity="0.6" />

    <!-- Huge Discount Tag Ribbon -->
    <g transform="translate(-130, -5)">
      <circle cx="0" cy="0" r="70" fill="#e11d48" stroke="#fef08a" stroke-width="4" />
      <text x="0" y="-18" fill="#fef08a" font-size="14" font-weight="900" font-family="'Inter', sans-serif" text-anchor="middle">HEMAT HINGGA</text>
      <text x="0" y="24" fill="#ffffff" font-size="44" font-weight="900" font-family="'Inter', sans-serif" text-anchor="middle">30%</text>
      <text x="0" y="46" fill="#fecdd3" font-size="11" font-weight="700" font-family="'Inter', sans-serif" text-anchor="middle">MUSHAF PILIHAN</text>
    </g>

    <!-- Right Side Benefits List -->
    <g transform="translate(70, -40)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="-15" cy="0" r="10" fill="#10b981" />
        <path d="M -19,0 L -16,3 L -11,-3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <text x="5" y="4" fill="#ffffff" font-size="14" font-weight="800" font-family="'Inter', sans-serif">100% Produk Original</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 32)">
        <circle cx="-15" cy="0" r="10" fill="#10b981" />
        <path d="M -19,0 L -16,3 L -11,-3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <text x="5" y="4" fill="#ffffff" font-size="14" font-weight="800" font-family="'Inter', sans-serif">Penerbit Resmi Al-Qosbah</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 64)">
        <circle cx="-15" cy="0" r="10" fill="#10b981" />
        <path d="M -19,0 L -16,3 L -11,-3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <text x="5" y="4" fill="#ffffff" font-size="14" font-weight="800" font-family="'Inter', sans-serif">Kirim Seluruh Indonesia &amp; LN</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 96)">
        <circle cx="-15" cy="0" r="10" fill="#10b981" />
        <path d="M -19,0 L -16,3 L -11,-3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
        <text x="5" y="4" fill="#ffffff" font-size="14" font-weight="800" font-family="'Inter', sans-serif">Packing Dus Tebal &amp; Bubble Wrap</text>
      </g>
    </g>
  </g>

  <!-- Top Badges -->
  <g transform="translate(400, 65)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <text x="0" y="5" fill="#78350f" font-size="12" font-weight="900" font-family="'Inter', sans-serif" text-anchor="middle">★ PROMO SPESIAL TOKO RESMI ★</text>
  </g>
</svg>
