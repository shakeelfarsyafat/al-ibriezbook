<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="terjemahCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f5efe0"/>
    </linearGradient>
  </defs>

  <!-- Standing Closed Book (Left) -->
  <g transform="translate(35, 30)" filter="url(#bookShadow)">
    <path d="M 0 10 L 22 0 L 22 195 L 0 205 Z" fill="#0f172a" stroke="#d4af37" stroke-width="1"/>
    <text x="-115" y="15" transform="rotate(-90)" font-family="sans-serif" font-size="7" fill="#d4af37" font-weight="bold" letter-spacing="1">AL-QUR'AN TERJEMAH</text>
    <path d="M 22 0 L 105 15 L 105 210 L 22 195 Z" fill="url(#terjemahCover)" stroke="#d4af37" stroke-width="1.5"/>
    <rect x="34" y="26" width="60" height="150" fill="none" stroke="#eac55f" stroke-width="1" rx="4"/>
    <circle cx="64" cy="95" r="22" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <polygon points="64,78 70,88 82,88 72,96 76,108 64,101 52,108 56,96 46,88 58,88" fill="#fce899"/>
    <text x="64" y="99" font-family="'Amiri', serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="bold">القرآن</text>
    <text x="64" y="138" font-family="sans-serif" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">TERJEMAH</text>
    <text x="64" y="150" font-family="sans-serif" font-size="5.5" fill="#eac55f" text-anchor="middle">STANDAR KEMENAG</text>
  </g>

  <!-- Open Book (Right) Showing Arabic & Translation Columns -->
  <g transform="translate(150, 45)" filter="url(#bookShadow)">
    <path d="M 10 185 Q 50 180 95 188 L 95 18 Q 50 10 10 18 Z" fill="url(#pageGrad)" stroke="#dcd6c5" stroke-width="1"/>
    <path d="M 95 188 Q 140 180 180 185 L 180 18 Q 140 10 95 18 Z" fill="url(#pageGrad)" stroke="#dcd6c5" stroke-width="1"/>
    <rect x="93" y="14" width="4" height="174" fill="#000000" opacity="0.15"/>

    <!-- Left Page: Arabic Column & Translation Column -->
    <rect x="18" y="25" width="34" height="150" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="54" y="25" width="34" height="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Lines -->
    <line x1="22" y1="35" x2="48" y2="35" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="48" x2="48" y2="48" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="61" x2="48" y2="61" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="74" x2="48" y2="74" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="87" x2="48" y2="87" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="100" x2="48" y2="100" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="113" x2="48" y2="113" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="126" x2="48" y2="126" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="139" x2="48" y2="139" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="152" x2="48" y2="152" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Translation side lines (smaller, latin) -->
    <line x1="58" y1="35" x2="84" y2="35" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="48" x2="84" y2="48" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="61" x2="84" y2="61" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="74" x2="84" y2="74" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="87" x2="84" y2="87" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="100" x2="84" y2="100" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="113" x2="84" y2="113" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="126" x2="84" y2="126" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="139" x2="84" y2="139" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="58" y1="152" x2="84" y2="152" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Right Page: Arabic & Translation -->
    <rect x="102" y="25" width="34" height="150" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <rect x="138" y="25" width="34" height="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="106" y1="35" x2="132" y2="35" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="48" x2="132" y2="48" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="61" x2="132" y2="61" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="74" x2="132" y2="74" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="87" x2="132" y2="87" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="100" x2="132" y2="100" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="113" x2="132" y2="113" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="126" x2="132" y2="126" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="139" x2="132" y2="139" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="106" y1="152" x2="132" y2="152" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>

    <line x1="142" y1="35" x2="168" y2="35" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="48" x2="168" y2="48" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="61" x2="168" y2="61" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="74" x2="168" y2="74" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="87" x2="168" y2="87" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="100" x2="168" y2="100" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="113" x2="168" y2="113" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="126" x2="168" y2="126" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="139" x2="168" y2="139" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="142" y1="152" x2="168" y2="152" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  </g>
</svg>
