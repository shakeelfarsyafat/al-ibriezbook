<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHafalan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0e3a53" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowHafalan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="28" fill="url(#bgHafalan)" />

  <!-- Stars & Constellations -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="100" cy="80" r="1.5" />
    <circle cx="250" cy="60" r="2" />
    <circle cx="160" cy="140" r="1" />
    <circle cx="680" cy="90" r="2" />
    <circle cx="720" cy="170" r="1.5" />
    <circle cx="640" cy="380" r="2" />
    <circle cx="120" cy="400" r="1.5" />
  </g>

  <!-- Islamic Geometric Rosette in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="2" fill="none" transform="translate(400, 240)">
    <circle r="180" />
    <circle r="130" />
    <polygon points="0,-170 120,-120 170,0 120,120 0,170 -120,120 -170,0 -120,-120" />
    <polygon points="0,-130 92,-92 130,0 92,92 0,130 -92,92 -130,0 -92,-92" transform="rotate(45)" />
  </g>

  <circle cx="400" cy="240" r="220" fill="url(#cyanGlow)" />

  <!-- 5 COLOR BLOCKS (HAFALAN CONCEPT SHOWCASE) -->
  <g transform="translate(400, 240)" filter="url(#shadowHafalan)">
    <!-- Book Shadow & Base Shape -->
    <rect x="-210" y="-130" width="420" height="260" rx="18" fill="#04202c" stroke="#38bdf8" stroke-width="2" />

    <!-- Open Spine -->
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#0284c7" stroke-width="3" />

    <!-- Left Page - 5 Color Blocks Visual Representation -->
    <g transform="translate(-105, 0)">
      <!-- Block 1: Kuning -->
      <rect x="-85" y="-115" width="170" height="38" rx="8" fill="#fef08a" opacity="0.9" />
      <text x="-65" y="-91" fill="#854d0e" font-size="11" font-weight="800" font-family="'Inter', sans-serif">BLOK 1 • HAFALKAN AYAT 1</text>
      
      <!-- Block 2: Hijau -->
      <rect x="-85" y="-70" width="170" height="38" rx="8" fill="#bbf7d0" opacity="0.9" />
      <text x="-65" y="-46" fill="#166534" font-size="11" font-weight="800" font-family="'Inter', sans-serif">BLOK 2 • HAFALKAN AYAT 2</text>

      <!-- Block 3: Biru Muda -->
      <rect x="-85" y="-25" width="170" height="38" rx="8" fill="#bae6fd" opacity="0.9" />
      <text x="-65" y="-1" fill="#075985" font-size="11" font-weight="800" font-family="'Inter', sans-serif">BLOK 3 • GABUNGKAN 1 &amp; 2</text>

      <!-- Block 4: Merah Muda -->
      <rect x="-85" y="20" width="170" height="38" rx="8" fill="#fecdd3" opacity="0.9" />
      <text x="-65" y="44" fill="#9f1239" font-size="11" font-weight="800" font-family="'Inter', sans-serif">BLOK 4 • HAFALKAN AYAT 3</text>

      <!-- Block 5: Oranye -->
      <rect x="-85" y="65" width="170" height="38" rx="8" fill="#fed7aa" opacity="0.9" />
      <text x="-65" y="89" fill="#9a3412" font-size="11" font-weight="800" font-family="'Inter', sans-serif">BLOK 5 • ULANG SATU HALAMAN</text>
    </g>

    <!-- Right Page - Arabic Surah Simulation & Target Hafalan Badge -->
    <g transform="translate(105, 0)">
      <rect x="-85" y="-115" width="170" height="218" rx="10" fill="#f8fafc" />
      
      <!-- Heading -->
      <rect x="-70" y="-102" width="140" height="18" rx="6" fill="#0284c7" />
      <text x="0" y="-89" fill="#ffffff" font-size="9" font-weight="800" font-family="'Inter', sans-serif" text-anchor="middle">METODE 5 JAM HAFAL 1 JUZ</text>

      <!-- Simulated Arabic Lines with color accents -->
      <line x1="-70" y1="-70" x2="70" y2="-70" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <line x1="-70" y1="-50" x2="50" y2="-50" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <line x1="-70" y1="-30" x2="70" y2="-30" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <line x1="-50" y1="-10" x2="70" y2="-10" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <line x1="-70" y1="10" x2="60" y2="10" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <line x1="-70" y1="30" x2="70" y2="30" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

      <!-- Tahfidz Seal Badge -->
      <circle cx="0" cy="65" r="26" fill="#059669" stroke="#34d399" stroke-width="3" />
      <polygon points="0,48 4,59 16,59 7,67 10,78 0,72 -10,78 -7,67 -16,59 -4,59" fill="#fbbf24" />
      <text x="0" y="85" fill="#ffffff" font-size="7" font-weight="800" font-family="'Inter', sans-serif" text-anchor="middle">TAHFIDZ READY</text>
    </g>
  </g>

  <!-- Floating Tags -->
  <g transform="translate(150, 80)" filter="url(#shadowHafalan)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="middle">5 BLOK WARNA</text>
  </g>

  <g transform="translate(650, 80)" filter="url(#shadowHafalan)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#d97706" stroke="#fef08a" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-size="11" font-weight="800" font-family="'Inter', sans-serif" text-anchor="middle">PANDUAN AWAL AYAT</text>
  </g>
</svg>
