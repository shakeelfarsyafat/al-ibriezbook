<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="hafalanCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f5efe0"/>
    </linearGradient>
  </defs>

  <!-- Best Seller Badge -->
  <g transform="translate(300, 15)">
    <circle cx="28" cy="28" r="26" fill="#094e36" stroke="#d4af37" stroke-width="2"/>
    <text x="28" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#fce899" text-anchor="middle" letter-spacing="0.5">BEST</text>
    <text x="28" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SELLER</text>
  </g>

  <!-- Standing Closed Book (Left) -->
  <g transform="translate(35, 30)" filter="url(#bookShadow)">
    <!-- Book Spine -->
    <path d="M 0 10 L 22 0 L 22 195 L 0 205 Z" fill="#0b1320" stroke="#d4af37" stroke-width="1"/>
    <text x="-105" y="15" transform="rotate(-90)" font-family="sans-serif" font-size="7" fill="#d4af37" font-weight="bold" letter-spacing="1">AL-QUR'AN HAFALAN</text>
    <!-- Book Cover -->
    <path d="M 22 0 L 105 15 L 105 210 L 22 195 Z" fill="url(#hafalanCover)" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Gold Medallion Frame -->
    <rect x="34" y="26" width="60" height="150" fill="none" stroke="#eac55f" stroke-width="1" rx="4"/>
    <circle cx="64" cy="95" r="22" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <polygon points="64,78 70,88 82,88 72,96 76,108 64,101 52,108 56,96 46,88 58,88" fill="#fce899"/>
    <text x="64" y="99" font-family="'Amiri', serif" font-size="10" fill="#094e36" text-anchor="middle" font-weight="bold">القرآن</text>
    <text x="64" y="138" font-family="sans-serif" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">AL-HIFDZ</text>
    <text x="64" y="150" font-family="sans-serif" font-size="5.5" fill="#eac55f" text-anchor="middle">5 BLOK WARNA</text>
  </g>

  <!-- Open Book (Right) Showing Color Blocks for Memorization -->
  <g transform="translate(150, 45)" filter="url(#bookShadow)">
    <!-- Book Pages Background Left Page -->
    <path d="M 10 185 Q 50 180 95 188 L 95 18 Q 50 10 10 18 Z" fill="url(#pageGrad)" stroke="#dcd6c5" stroke-width="1"/>
    <!-- Book Pages Background Right Page -->
    <path d="M 95 188 Q 140 180 180 185 L 180 18 Q 140 10 95 18 Z" fill="url(#pageGrad)" stroke="#dcd6c5" stroke-width="1"/>

    <!-- Page Center Spine Shadow -->
    <rect x="93" y="14" width="4" height="174" fill="#000000" opacity="0.15"/>

    <!-- Color Blocks on Left Page (Hafalan 5 Blok) -->
    <rect x="18" y="28" width="70" height="26" fill="#fef3c7" rx="2" stroke="#fcd34d" stroke-width="0.7"/>
    <rect x="18" y="58" width="70" height="26" fill="#dcfce7" rx="2" stroke="#86efac" stroke-width="0.7"/>
    <rect x="18" y="88" width="70" height="26" fill="#e0e7ff" rx="2" stroke="#a5b4fc" stroke-width="0.7"/>
    <rect x="18" y="118" width="70" height="26" fill="#fce7f3" rx="2" stroke="#f9a8d4" stroke-width="0.7"/>
    <rect x="18" y="148" width="70" height="26" fill="#ffedd5" rx="2" stroke="#fdba74" stroke-width="0.7"/>

    <!-- Pseudo Arabic Lines in Blocks -->
    <line x1="24" y1="41" x2="82" y2="41" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,4,12,3"/>
    <line x1="24" y1="71" x2="82" y2="71" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,3,10,3"/>
    <line x1="24" y1="101" x2="82" y2="101" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="12,3,6,3"/>
    <line x1="24" y1="131" x2="82" y2="131" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="7,4,14,3"/>
    <line x1="24" y1="161" x2="82" y2="161" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="14,3,8,3"/>

    <!-- Color Blocks on Right Page -->
    <rect x="102" y="28" width="70" height="26" fill="#fef3c7" rx="2" stroke="#fcd34d" stroke-width="0.7"/>
    <rect x="102" y="58" width="70" height="26" fill="#dcfce7" rx="2" stroke="#86efac" stroke-width="0.7"/>
    <rect x="102" y="88" width="70" height="26" fill="#e0e7ff" rx="2" stroke="#a5b4fc" stroke-width="0.7"/>
    <rect x="102" y="118" width="70" height="26" fill="#fce7f3" rx="2" stroke="#f9a8d4" stroke-width="0.7"/>
    <rect x="102" y="148" width="70" height="26" fill="#ffedd5" rx="2" stroke="#fdba74" stroke-width="0.7"/>

    <line x1="108" y1="41" x2="166" y2="41" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="9,3,11,4"/>
    <line x1="108" y1="71" x2="166" y2="71" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="12,4,8,3"/>
    <line x1="108" y1="101" x2="166" y2="101" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,4,12,3"/>
    <line x1="108" y1="131" x2="166" y2="131" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="14,3,7,4"/>
    <line x1="108" y1="161" x2="166" y2="161" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,3,10,3"/>
  </g>
</svg>
