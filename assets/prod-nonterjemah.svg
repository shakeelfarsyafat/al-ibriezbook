<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="nonterjemahCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011b15"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f5efe0"/>
    </linearGradient>
  </defs>

  <!-- Special Badge -->
  <g transform="translate(300, 15)">
    <circle cx="28" cy="28" r="26" fill="#b45309" stroke="#d4af37" stroke-width="2"/>
    <text x="28" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#fce899" text-anchor="middle" letter-spacing="0.5">TILAWAH</text>
    <text x="28" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">WARNA</text>
  </g>

  <!-- Standing Closed Book (Left) -->
  <g transform="translate(35, 30)" filter="url(#bookShadow)">
    <path d="M 0 10 L 22 0 L 22 195 L 0 205 Z" fill="#022c22" stroke="#d4af37" stroke-width="1"/>
    <text x="-120" y="15" transform="rotate(-90)" font-family="sans-serif" font-size="7" fill="#d4af37" font-weight="bold" letter-spacing="1">AL-QUR'AN AL-MUTTAQIN</text>
    <path d="M 22 0 L 105 15 L 105 210 L 22 195 Z" fill="url(#nonterjemahCover)" stroke="#d4af37" stroke-width="1.5"/>
    <rect x="34" y="26" width="60" height="150" fill="none" stroke="#eac55f" stroke-width="1" rx="4"/>
    <circle cx="64" cy="95" r="22" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    <polygon points="64,78 70,88 82,88 72,96 76,108 64,101 52,108 56,96 46,88 58,88" fill="#fce899"/>
    <text x="64" y="99" font-family="'Amiri', serif" font-size="10" fill="#064e3b" text-anchor="middle" font-weight="bold">المتقين</text>
    <text x="64" y="138" font-family="sans-serif" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">NON TERJEMAH</text>
    <text x="64" y="150" font-family="sans-serif" font-size="5" fill="#eac55f" text-anchor="middle">TAJWID &amp; WAQAF</text>
  </g>

  <!-- Open Book (Right) Showing Big Full Tilawah Arabic Pages -->
  <g transform="translate(150, 45)" filter="url(#bookShadow)">
    <path d="M 10 185 Q 50 180 95 188 L 95 18 Q 50 10 10 18 Z" fill="url(#pageGrad)" stroke="#dcd6c5" stroke-width="1"/>
    <path d="M 95 188 Q 140 180 180 185 L 180 18 Q 140 10 95 18 Z" fill="url(#pageGrad)" stroke="#dcd6c5" stroke-width="1"/>
    <rect x="93" y="14" width="4" height="174" fill="#000000" opacity="0.15"/>

    <!-- Left Page Ornate Frame & Verses -->
    <rect x="16" y="22" width="72" height="155" fill="none" stroke="#d4af37" stroke-width="1"/>
    <rect x="18" y="24" width="68" height="151" fill="none" stroke="#064e3b" stroke-width="0.5"/>

    <!-- Decorative Top Surah Banner -->
    <rect x="20" y="27" width="64" height="14" fill="#064e3b" rx="2"/>
    <text x="52" y="37" font-family="'Amiri', serif" font-size="7" fill="#fce899" text-anchor="middle">سُورَةُ الفَاتِحَة</text>

    <!-- Verses with Colored Tajwid Lines -->
    <line x1="22" y1="52" x2="82" y2="52" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="65" x2="82" y2="65" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="78" x2="82" y2="78" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="91" x2="82" y2="91" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="104" x2="82" y2="104" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="117" x2="82" y2="117" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="130" x2="82" y2="130" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="143" x2="82" y2="143" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <line x1="22" y1="156" x2="82" y2="156" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Page Ornate Frame & Verses -->
    <rect x="102" y="22" width="72" height="155" fill="none" stroke="#d4af37" stroke-width="1"/>
    <rect x="104" y="24" width="68" height="151" fill="none" stroke="#064e3b" stroke-width="0.5"/>

    <rect x="106" y="27" width="64" height="14" fill="#064e3b" rx="2"/>
    <text x="138" y="37" font-family="'Amiri', serif" font-size="7" fill="#fce899" text-anchor="middle">سُورَةُ البَقَرَة</text>

    <line x1="108" y1="52" x2="168" y2="52" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="65" x2="168" y2="65" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="78" x2="168" y2="78" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="91" x2="168" y2="91" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="104" x2="168" y2="104" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="117" x2="168" y2="117" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="130" x2="168" y2="130" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="143" x2="168" y2="143" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
    <line x1="108" y1="156" x2="168" y2="156" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
