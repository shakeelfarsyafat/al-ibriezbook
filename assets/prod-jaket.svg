<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%">
  <defs>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="leatherCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="zipperGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f5efe0"/>
    </linearGradient>
  </defs>

  <!-- Standing Closed Leather Quran with Magnetic Flap (Left) -->
  <g transform="translate(35, 30)" filter="url(#bookShadow)">
    <rect x="0" y="5" width="105" height="205" rx="10" fill="url(#leatherCover)" stroke="#3b82f6" stroke-width="1"/>
    <!-- Stitching around edge -->
    <rect x="5" y="10" width="95" height="195" rx="7" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Magnetic Closure Strap / Flap -->
    <path d="M 0 95 L 45 95 C 55 95, 60 100, 60 110 C 60 120, 55 125, 45 125 L 0 125 Z" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1"/>
    <!-- Gold Snap Button -->
    <circle cx="48" cy="110" r="5" fill="url(#zipperGold)" stroke="#b45309" stroke-width="0.8"/>

    <!-- Gold Embossed Medallion on front -->
    <circle cx="55" cy="55" r="16" fill="none" stroke="#d4af37" stroke-width="1.2"/>
    <polygon points="55,44 59,51 67,51 61,56 63,64 55,59 47,64 49,56 43,51 51,51" fill="#fce899"/>
    <text x="55" y="165" font-family="sans-serif" font-size="6.5" fill="#ffffff" font-weight="bold" text-anchor="middle">COVER JAKET LUX</text>
    <text x="55" y="177" font-family="sans-serif" font-size="5" fill="#93c5fd" text-anchor="middle">RESLETING KULIT</text>
  </g>

  <!-- Open Quran with Leather Zipper Edge (Right) -->
  <g transform="translate(150, 45)" filter="url(#bookShadow)">
    <rect x="5" y="12" width="180" height="180" rx="8" fill="#172554"/>
    <rect x="8" y="15" width="174" height="174" rx="6" fill="none" stroke="url(#zipperGold)" stroke-width="1.5" stroke-dasharray="2,2"/>

    <path d="M 12 182 Q 50 178 95 185 L 95 22 Q 50 15 12 22 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 95 185 Q 140 178 178 182 L 178 22 Q 140 15 95 22 Z" fill="url(#pageGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="93" y="18" width="4" height="170" fill="#000000" opacity="0.15"/>

    <!-- Content Lines -->
    <line x1="20" y1="40" x2="80" y2="40" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="55" x2="80" y2="55" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="80" y2="70" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="85" x2="80" y2="85" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="100" x2="80" y2="100" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="115" x2="80" y2="115" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="130" x2="80" y2="130" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="145" x2="80" y2="145" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

    <line x1="105" y1="40" x2="165" y2="40" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="55" x2="165" y2="55" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="70" x2="165" y2="70" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="85" x2="165" y2="85" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="100" x2="165" y2="100" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="115" x2="165" y2="115" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="130" x2="165" y2="130" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="105" y1="145" x2="165" y2="145" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
